version: 2

project_name: pg-monk

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/pgmonk
    binary: pg-monk
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: shashank
      name: homebrew-pgmonk
    homepage: "https://github.com/shashank/pg-monk"
    description: "Real-time PostgreSQL performance dashboard for your terminal"
    license: "MIT"
    install: |
      bin.install "pg-monk"
    test: |
      system "#{bin}/pg-monk", "--version"
